name: Notebook CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev]

jobs:
  lint:
    name: nbformat + nbstripout lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint dependencies
        # nbstripout is pinned to the rev .pre-commit-config.yaml uses, so the check and the hook strip the same keys
        run: pip install "nbformat>=5.9" "nbstripout==0.9.1"
      - name: Validate notebook structure
        run: |
          python - << 'EOF'
          import glob, sys, nbformat
          errors = []
          for path in sorted(glob.glob("notebooks/*.ipynb")):
              try:
                  nb = nbformat.read(path, as_version=4)
                  nbformat.validate(nb)
                  print(f"  OK  {path}")
              except nbformat.ValidationError as e:
                  errors.append(f"  FAIL {path}: {e}")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(f"\n{len(glob.glob('notebooks/*.ipynb'))} notebooks validated.")
          EOF
      - name: Verify outputs are stripped (four notebooks keep theirs)
        run: |
          # These four notebooks commit their outputs on purpose, so a reader
          # sees a full run's results; every other notebook must be stripped.
          ALLOWLIST="arena_prediction_runner bus_message_validation interop_mcp_utcp_clients speaker_verification"
          fail=0
          for nb in notebooks/*.ipynb; do
            stem=$(basename "$nb" .ipynb)
            skip=0
            for allowed in $ALLOWLIST; do
              [ "$stem" = "$allowed" ] && skip=1
            done
            if [ "$skip" = "1" ]; then
              echo "  SKIP (allowlisted) $nb"
              continue
            fi
            if ! nbstripout --verify "$nb"; then
              echo "  FAIL (has outputs) $nb"
              fail=1
            else
              echo "  OK   $nb"
            fi
          done
          exit $fail
      - name: Scan every notebook for private paths and identifiers
        # nbstripout --verify above only looks at the non-allowlisted notebooks;
        # the four notebooks that keep their outputs are
        # never scanned for a maintainer's home directory or address without this.
        run: python tools/scan_private_paths.py

  discover:
    name: Discover notebook matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: List every notebook and require its requirements file
        id: list
        run: |
          python - << 'EOF' >> "$GITHUB_OUTPUT"
          import glob, json, os, sys
          # These speak with OmniVoice, which needs a GPU; they run on Kaggle, not here.
          GPU_ONLY = {
              "arena_prediction_runner", "interop_mcp_utcp_clients", "speaker_verification",
              "train_vits", "tts2ww_full_pipeline", "tts_enhance", "tts_measure",
              "tts_publish", "tts_voice_convert",
          }
          stems = sorted(
              os.path.splitext(os.path.basename(p))[0]
              for p in glob.glob("notebooks/*.ipynb")
          )
          missing = [s for s in stems if not os.path.isfile(f"requirements/{s}.txt")]
          if missing:
              print(f"missing requirements/<stem>.txt for: {missing}", file=sys.stderr)
              sys.exit(1)
          print("matrix=" + json.dumps([s for s in stems if s not in GPU_ONLY]))
          EOF

  compile:
    name: Compile code cells (py${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile every code cell, magics stripped
        run: python tools/compile_notebooks.py

  smoke:
    name: Smoke run (${{ matrix.notebook }})
    needs: [lint, discover]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        notebook: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg sox espeak-ng
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Create venv and install notebook requirements
        run: |
          uv python install 3.12
          uv venv .venv --python 3.12
          source .venv/bin/activate
          # A uv-created venv ships no `pip`. Several notebooks run a bare
          # `!pip install ...` or `%pip install ...` cell for a step-specific
          # package (e.g. the audiosronnx / voiceclonnx installs in asr2tts
          # and the wake-word plugin reinstall in kaggle_quickstart_ww).
          # Without this, that line is a silent no-op and the next import
          # raises ModuleNotFoundError.
          uv pip install --prerelease=allow pip
          uv pip install --prerelease=allow jupyter papermill ipykernel nest_asyncio
          uv pip install --prerelease=allow -r requirements/${{ matrix.notebook }}.txt
      - name: Run smoke path
        run: |
          source .venv/bin/activate
          n_samples=4
          if [ "${{ matrix.notebook }}" = "kaggle_quickstart_ww" ]; then
            n_samples=32
          fi
          papermill --log-output notebooks/${{ matrix.notebook }}.ipynb /tmp/out.ipynb \
            -p SMOKE True -p N_SAMPLES $n_samples -p EPOCHS 1

  evidence:
    name: Execute evidence notebook (${{ matrix.notebook }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # arena_prediction_runner, interop_mcp_utcp_clients and speaker_verification
        # also keep their outputs, but speak with OmniVoice on a GPU; they run on Kaggle.
        notebook:
          - bus_message_validation
    env:
      # A neutral, non-home HOME so a plugin's cache directory (vosk's model,
      # for example) resolves under /tmp instead of the runner account's home
      # and the committed outputs never depend on who or where ran them.
      HOME: /tmp/evidence-home
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg sox espeak-ng
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Create venv and install notebook requirements
        run: |
          mkdir -p "$HOME"
          uv python install 3.12
          uv venv .venv --python 3.12
          source .venv/bin/activate
          uv pip install --prerelease=allow pip
          uv pip install --prerelease=allow jupyter papermill ipykernel nest_asyncio
          uv pip install --prerelease=allow -r requirements/${{ matrix.notebook }}.txt
      - name: Execute the notebook in place, from a neutral HOME
        # This is the notebook's full run, not the CI smoke path: no
        # SMOKE/N_SAMPLES/EPOCHS override, so it runs whatever the notebook's
        # own parameters cell declares as its full-run default.
        run: |
          source .venv/bin/activate
          papermill --log-output notebooks/${{ matrix.notebook }}.ipynb notebooks/${{ matrix.notebook }}.ipynb
      - name: Scan the executed notebook for private paths and identifiers
        run: python tools/scan_private_paths.py notebooks/${{ matrix.notebook }}.ipynb
      - uses: actions/upload-artifact@v7
        with:
          name: evidence-${{ matrix.notebook }}
          path: notebooks/${{ matrix.notebook }}.ipynb
